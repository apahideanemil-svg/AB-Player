<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB Player</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2764d8">
</head>

<body>
    <main class="player">
        <h1>AB Player</h1>

        <p id="fileName" class="file-name">
            Niciun fișier deschis
        </p>

        <audio id="audio"></audio>

        <div class="time-display">
            <span id="currentTime">00:00.0</span>
            <span>/</span>
            <span id="duration">00:00.0</span>
        </div>

        <input
            id="seekBar"
            class="seek-bar"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
        >

        <div class="ab-buttons">
            <button id="buttonA" class="large-button" title="Tasta A">
                A
                <span class="keyboard-hint">Tasta A</span>
            </button>

            <button id="buttonB" class="large-button" title="Tasta V">
                B
                <span class="keyboard-hint">Tasta V</span>
            </button>

            <button
                id="resetButton"
                class="large-button reset-button"
                title="Tasta R"
                    >
                Reset AB
                <span class="keyboard-hint">Tasta R</span>
                </button>
        </div>

        <div class="secondary-buttons">
            <label for="fileInput" class="secondary-button">
                Open
            </label>

            <input
                id="fileInput"
                type="file"
                accept="audio/*"
                hidden
            >

            <button id="playPauseButton" class="secondary-button">
                Play
            </button>

            <button id="backButton" class="secondary-button">
                −5 sec
            </button>

            <button id="forwardButton" class="secondary-button">
                +5 sec
            </button>
        </div>

        <div class="markers">
            <div>
                A:
                <span id="timeA">—</span>
            </div>

            <div>
                B:
                <span id="timeB">—</span>
            </div>
        </div>

        <div class="adjust-buttons">
            <button id="aMinus">A −0.2s</button>
            <button id="aPlus">A +0.2s</button>

            <button id="bMinus">B −0.2s</button>
            <button id="bPlus">B +0.2s</button>
        </div>

        <div class="speed-control">
            <span>Viteză:</span>

            <button class="speedButton" data-speed="0.75">0.75×</button>
            <button class="speedButton" data-speed="0.90">0.90×</button>
            <button class="speedButton" data-speed="1">1.00×</button>
            <button class="speedButton" data-speed="1.10">1.10×</button>
            <button class="speedButton" data-speed="1.25">1.25×</button>
        </div>

        <div class="pause-control">
            <span>Pauză între repetări:</span>

            <button class="pauseButton" data-pause="0">0s</button>
            <button class="pauseButton" data-pause="0.5">0.5s</button>
            <button class="pauseButton" data-pause="1">1s</button>
            <button class="pauseButton" data-pause="1.5">1.5s</button>
            <button class="pauseButton" data-pause="2">2s</button>
            <button class="pauseButton" data-pause="3">3s</button>
        </div>

        <div class="repeat-control">
            <span>Repetări:</span>

            <button class="repeatButton" data-repeat="0">∞</button>
            <button class="repeatButton" data-repeat="2">2×</button>
            <button class="repeatButton" data-repeat="3">3×</button>
            <button class="repeatButton" data-repeat="5">5×</button>
            <button class="repeatButton" data-repeat="10">10×</button>
        </div>

        <div id="loopStatus" class="loop-status">
            Repetarea A–B este oprită
        </div>

        <div id="playerStatus" class="player-status">
            Viteză 1.00× · Pauză 0s · Repetări ∞
        </div>

        
    </main>

    <script src="script.js"></script>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker
                .register("./service-worker.js")
                .then(function () {
                    console.log("Service Worker înregistrat.");
                })
                .catch(function (error) {
                    console.error(
                        "Eroare Service Worker:",
                        error
                    );
                });
        });
    }
    </script>
</body>
</html>
